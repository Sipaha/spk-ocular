name: Build environment
description: Configure the native toolchain and isolated test scratch space
runs:
  using: composite
  steps:
    - name: Prepare scratch directories
      shell: bash
      run: |
        python - <<'PYENV'
        import os
        from pathlib import Path
        scratch = Path(os.environ['GITHUB_WORKSPACE']) / '.agents/tmp'
        for name in ('go', 'tools'):
            (scratch / name).mkdir(parents=True, exist_ok=True)
        env = {'OCULAR_SCRATCH_DIR': scratch, 'TMPDIR': scratch / 'go',
               'TMP': scratch / 'go', 'TEMP': scratch / 'go', 'GOBIN': scratch / 'tools'}
        with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
            for key, value in env.items():
                output.write(f'{key}={value}\n')
        with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as output:
            output.write(str(scratch / 'tools') + '\n')
        PYENV
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        package-manager-cache: false
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 10.33.0
        cache: true
        cache_dependency_path: |
          web/pnpm-lock.yaml
          tests/e2e/pnpm-lock.yaml
    - name: Install native build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev desktop-file-utils xvfb imagemagick tesseract-ocr
    - name: Install JavaScript dependencies
      shell: bash
      run: |
        pnpm --dir web install --frozen-lockfile
        pnpm --dir tests/e2e install --frozen-lockfile
