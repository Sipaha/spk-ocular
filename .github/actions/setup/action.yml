name: Build environment
description: Configure the Linux toolchain and isolated test scratch space
runs:
  using: composite
  steps:
    - name: Prepare scratch directories
      shell: bash
      run: |
        scratch="$GITHUB_WORKSPACE/.agents/tmp"
        mkdir -p "$scratch/go" "$scratch/tools"
        echo "OCULAR_SCRATCH_DIR=$scratch" >> "$GITHUB_ENV"
        echo "TMPDIR=$scratch/go" >> "$GITHUB_ENV"
        echo "GOBIN=$scratch/tools" >> "$GITHUB_ENV"
        echo "$scratch/tools" >> "$GITHUB_PATH"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        package-manager-cache: false
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 10.33.0
        cache: true
        cache_dependency_path: |
          web/pnpm-lock.yaml
          tests/e2e/pnpm-lock.yaml
    - name: Install native build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev desktop-file-utils
    - name: Install JavaScript dependencies
      shell: bash
      run: |
        pnpm --dir web install --frozen-lockfile
        pnpm --dir tests/e2e install --frozen-lockfile
