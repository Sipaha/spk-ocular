name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Validate the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 packaging/validate-tag.py
  test:
    needs: validate
    uses: ./.github/workflows/test.yml
  packages:
    needs: [validate, test]
    uses: ./.github/workflows/package-linux.yml
    with:
      version: ${{ needs.validate.outputs.version }}
  packages-native:
    needs: [validate, test]
    uses: ./.github/workflows/package-native.yml
    with:
      version: ${{ needs.validate.outputs.version }}
  publish:
    needs: [validate, packages, packages-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          merge-multiple: true
          path: dist/release
      - name: Verify the complete asset set
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: python3 packaging/verify.py --version "$RELEASE_VERSION" --all-platforms --directory dist/release
      - name: Publish only after every upload succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 packaging/publish.py
