name: CI
on:
  push:
    branches: [master, 'release/**']
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    uses: ./.github/workflows/test.yml
  packages:
    needs: test
    uses: ./.github/workflows/package-linux.yml
  packages-native:
    needs: test
    uses: ./.github/workflows/package-native.yml
