name: Windows and macOS packages
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            runner: windows-2025
          - os: windows
            arch: arm64
            runner: windows-11-arm
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install WiX in workspace scratch
        if: runner.os == 'Windows'
        run: dotnet tool install wix --version 5.0.2 --tool-path "$GOBIN"
      - name: Native platform tests
        env:
          TARGET_OS: ${{ matrix.os }}
        run: |
          if [ "$TARGET_OS" = windows ]; then
            go vet -tags wails ./...
            go test -timeout 180s ./internal/agentapi
            go test -timeout 180s ./internal/privatefs ./internal/paths ./internal/desktop ./internal/agentapi ./internal/execshim ./internal/providers/compose/engine -run 'TestWindows|TestResolve|TestEnsure|TestShimLifetime'
          else
            go test -race -timeout 180s ./internal/agentapi ./internal/execshim ./internal/paths ./internal/privatefs ./internal/desktop ./internal/providers/compose/engine
          fi
      - name: Build production application and installers
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          TARGET_OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          version="$REQUESTED_VERSION"
          if [ -z "$version" ]; then
            base="$(cat VERSION)"
            if [[ "$base" == *-* ]]; then version="$base.dev.$GITHUB_RUN_NUMBER"; else version="$base-dev.$GITHUB_RUN_NUMBER"; fi
          fi
          version="${version#v}"
          python packaging/portable.py --version "$version" --os "$TARGET_OS" --arch "$ARCH"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Verify archives, binary architecture, version and checksums
        env:
          TARGET_OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: python packaging/verify-portable.py --version "$RELEASE_VERSION" --os "$TARGET_OS" --arch "$ARCH"
      - name: Install and remove the MSI on the disposable runner
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: ./packaging/windows/verify-install.ps1 -Version $env:RELEASE_VERSION -Arch $env:ARCH
      - name: Start the packaged native application with an isolated profile
        env:
          TARGET_OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: python packaging/smoke-native.py --os "$TARGET_OS" --arch "$ARCH" --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/${{ env.RELEASE_VERSION }}/${{ matrix.os }}-${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload native diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-diagnostics-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            .agents/tmp/native-smoke/
            .agents/tmp/msi-*.log
          if-no-files-found: ignore
          retention-days: 7
