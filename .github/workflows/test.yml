name: Test
on:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITEST_MAX_WORKERS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install validation tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          pnpm --dir tests/e2e exec playwright install --with-deps chromium
      - name: Full local and CI gate
        run: |
          set -o pipefail
          mkdir -p .agents/tmp/check
          make check 2>&1 | tee .agents/tmp/check/make-check.log
      - name: Reachable Go vulnerabilities
        run: |
          set -o pipefail
          mkdir -p .agents/tmp/check
          govulncheck ./... 2>&1 | tee .agents/tmp/check/vulnerabilities.log
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-diagnostics
          path: |
            .agents/tmp/check/*.log
            .agents/tmp/playwright-*
          if-no-files-found: ignore
          retention-days: 7
