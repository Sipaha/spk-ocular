# kind ocular-dev: the control plane runs everything; the worker is the
# drain test node (P11). Its taint keeps ordinary pods off it: only drain
# fixtures (toleration + nodeSelector) and system DaemonSets run there.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # kind taints the control plane once there is a worker; here it stays
    # schedulable, as with one node.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          taints: []
  - role: worker
    labels:
      ocular.dev/drain: "only"
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: ocular.dev/drain
              value: only
              effect: NoSchedule
